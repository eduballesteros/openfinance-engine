services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:?Define POSTGRES_DB in .env (see .env.example)}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env (see .env.example)}'
      - 'POSTGRES_USER=${POSTGRES_USER:?Define POSTGRES_USER in .env (see .env.example)}'
    ports:
      # Only reachable from this machine. 15432 avoids clashing with local PostgreSQL installs.
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      # PostgreSQL 18+ images expect the volume at /var/lib/postgresql (not .../data).
      - 'postgres-data:/var/lib/postgresql'
    healthcheck:
      # TCP check, so it does not pass while the init-only server is running.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
