spring:
  application:
    name: openfinance-engine
  config:
    # Loads the local .env as properties, so ${ANTHROPIC_API_KEY} etc. resolve without exporting them.
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-opus-5-5

openfinance:
  enable-banking:
    base-url: https://api.enablebanking.com
    application-id: ${ENABLE_BANKING_APPLICATION_ID:}
    private-key-path: ${ENABLE_BANKING_PRIVATE_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
