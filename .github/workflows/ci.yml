name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so gitleaks also checks older commits

      - name: Bloquear archivos sensibles
        run: |
          forbidden=$(git ls-files \
            | grep -E '(^|/)\.env(\..+)?$|\.(pem|key|p12|pfx|jks)$|(^|/)application-local\.ya?ml$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Archivos sensibles versionados (quítalos con 'git rm --cached' y rota las credenciales):"
            echo "$forbidden"
            exit 1
          fi
          echo "No hay archivos sensibles versionados."

      - name: Buscar credenciales en el historial (gitleaks)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose

  build:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar y ejecutar tests
        run: ./mvnw -B -ntp clean verify
